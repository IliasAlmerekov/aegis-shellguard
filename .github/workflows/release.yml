name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub Release tag whose npm publish failed"
        required: true
        type: string

# Least privilege by default, like ci.yml. The `release` job raises this to
# `contents: write` for itself, and it is the only job that needs to.
#
# Every checkout below sets `persist-credentials: false` for the same reason:
# nothing here pushes with the workflow token, so leaving it in `.git/config`
# would only expose it to a build script or a dependency. The jobs that talk to
# GitHub pass a token explicitly instead, through `GH_TOKEN` or the
# `action-gh-release` input.
permissions:
  contents: read

# A tag is pushed once and its artifacts are immutable, so a second run for the
# same tag is a re-run, never a supersede. Cancelling one mid-publish could
# leave a Release with a partial asset set, so queue instead of cancel.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Every pinned version this workflow uses lives in `.github/versions.env`, and
# the target matrix with its runner labels in `.github/build-targets.json`.
# The `config` job loads both and re-exports them as job outputs, because
# `runs-on:` cannot read a workflow `env:` value. Nothing else here may
# hard-code a version.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # The pinned versions, runner labels, and the release target matrix, read
  # from the two files ci.yml reads. A release therefore builds the same four
  # targets, on the same runner images, with the same toolchain that CI used.
  config:
    name: Load pinned versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_toolchain: ${{ steps.versions.outputs.rust_toolchain }}
      cargo_audit_version: ${{ steps.versions.outputs.cargo_audit_version }}
      cargo_deny_version: ${{ steps.versions.outputs.cargo_deny_version }}
      cross_version: ${{ steps.versions.outputs.cross_version }}
      node_version: ${{ steps.versions.outputs.node_version }}
      npm_cli_version: ${{ steps.versions.outputs.npm_cli_version }}
      build_targets: ${{ steps.versions.outputs.build_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-versions
        id: versions

  # Tag admission check, part 1 of 3. Pushing a `v*` tag used to start the
  # build matrix immediately: ci.yml does not trigger on tags, so a tag on a
  # commit that never went through CI shipped binaries to the GitHub Release,
  # npm, and the Homebrew tap. Nothing downstream runs until all three
  # admission jobs are green.
  #
  # This part is the cheap one and gates the two expensive ones. A tag that is
  # not reachable from `main` skipped code review and the nine required status
  # checks on that branch, and no amount of re-running fmt or clippy on it
  # would show that. Asking the compare API costs one request and needs no
  # git history, so the release checkout keeps its default shallow fetch.
  admission-ancestry:
    name: Tag admission (commit on main, CHANGELOG section)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tagged commit is reachable from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Comparing base=main against head=<tagged commit> reports `behind`
          # when the tag is an ancestor of main and `identical` when the tag
          # is main's head. `ahead` and `diverged` both mean the commit is not
          # on main.
          status="$(gh api "repos/$REPO/compare/main...$SHA" --jq .status)"
          case "$status" in
            identical | behind)
              echo "OK: $SHA is reachable from main (compare status: $status)"
              ;;
            *)
              echo "tagged commit $SHA is not reachable from main (compare status: $status)" >&2
              echo "Only a commit that merged into main has passed review and the required checks." >&2
              exit 1
              ;;
          esac

      # The `release` job below extracts this same section for the Release
      # body. Checking it exists here as well means a tag with no CHANGELOG
      # entry fails in under a minute instead of after the four-target build
      # matrix has run.
      - name: CHANGELOG has a non-empty section for this tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no non-empty '## [$version]' section for tag $TAG" >&2
            exit 1
          fi
          echo "OK: CHANGELOG.md has a '## [$version]' section"

  # Tag admission check, part 2 of 3. Same composite action the CI `Quality
  # (fmt, clippy, test)` job runs, so the tagged commit is held to the
  # identical standard rather than a copy that can drift.
  admission-quality:
    name: Tag admission (fmt, clippy, test)
    needs: [config, admission-ancestry]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/quality-gate
        with:
          toolchain: ${{ needs.config.outputs.rust_toolchain }}

  # Tag admission check, part 3 of 3. This one can fail on a commit that was
  # green when it merged: the advisory database moves, so a CVE published
  # after the merge turns up here. That is the intended outcome — Aegis does
  # not publish a binary with a known CVE in its dependency chain. Update the
  # dependency, merge, and re-tag.
  admission-security:
    name: Tag admission (audit, deny)
    needs: [config, admission-ancestry]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/security-gate
        with:
          toolchain: ${{ needs.config.outputs.rust_toolchain }}
          cargo-audit-version: ${{ needs.config.outputs.cargo_audit_version }}
          cargo-deny-version: ${{ needs.config.outputs.cargo_deny_version }}

  # The matrix comes from `.github/build-targets.json` and the build steps from
  # the `build-target` composite action, both shared with the `cross-matrix`
  # job in ci.yml. A target added there is built by CI and shipped by this job
  # without a second edit, and neither list can drift from the other.
  build:
    name: Build ${{ matrix.target }}
    needs: [config, admission-quality, admission-security]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.config.outputs.build_targets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.config.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}
          cache-key-prefix: ${{ matrix.target }}-

      - name: Build release binary
        uses: ./.github/actions/build-target
        with:
          target: ${{ matrix.target }}
          use-cross: ${{ matrix.use_cross }}
          cross-version: ${{ needs.config.outputs.cross_version }}

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/aegis ${{ matrix.asset_name }}
          chmod 0755 ${{ matrix.asset_name }}

      - name: Verify static Linux binary
        if: contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        run: |
          asset="${{ matrix.asset_name }}"
          file "$asset"
          # Inspect the ELF headers directly instead of running ldd. ldd executes
          # the binary's loader, which is unreliable for cross-compiled foreign
          # architectures and misreports static-pie binaries. A truly static
          # binary has no dynamic interpreter (PT_INTERP) and no shared library
          # dependencies (DT_NEEDED) — this holds for both classic "statically
          # linked" and musl "static-pie linked" outputs.
          if readelf -l "$asset" | grep -qw INTERP; then
            echo "expected static binary, but found a dynamic interpreter (PT_INTERP)" >&2
            readelf -l "$asset" >&2
            exit 1
          fi
          if readelf -d "$asset" 2>/dev/null | grep -qw NEEDED; then
            echo "expected static binary, but found shared library dependencies (DT_NEEDED)" >&2
            readelf -d "$asset" >&2
            exit 1
          fi
          echo "OK: $asset is statically linked (no PT_INTERP, no DT_NEEDED)"

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # The Release body is the curated `CHANGELOG.md` section for this tag, not
      # an auto-generated commit/PR list: someone opening the Release must read
      # what was added, changed, fixed, and secured, in the project's own words.
      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Capture every line after the `## [<version>]` heading up to the next
          # `## [` heading — i.e. exactly one release section, without its title.
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Fail closed, like the asset globs below: a tag whose CHANGELOG
          # section is missing or blank must not publish a Release that silently
          # documents nothing.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no non-empty '## [$version]' section for tag $TAG" >&2
            exit 1
          fi
          cat release-notes.md

      # The asset list is derived from `.github/build-targets.json` rather than
      # written out again here, so adding a target cannot produce a Release
      # that is missing its binary. `THIRD_PARTY_NOTICES.md` is repo-relative
      # rather than `artifacts/`-prefixed: it is checked in and comes from this
      # job's own `actions/checkout` above, not from the build matrix.
      - name: Resolve the release asset list
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          # `fail_on_unmatched_files` catches a file that is named but missing.
          # It cannot catch a list that names nothing, which is what an empty
          # `targets` array would produce: a Release with only the notices file.
          count="$(jq '.targets | length' .github/build-targets.json)"
          if [ "$count" -lt 1 ]; then
            echo "build-targets.json defines no release targets" >&2
            exit 1
          fi
          {
            echo "files<<ASSET_LIST_EOF"
            jq -r '.targets[] | "artifacts/\(.asset_name)", "artifacts/\(.asset_name).sha256"' \
              .github/build-targets.json
            echo "THIRD_PARTY_NOTICES.md"
            echo "ASSET_LIST_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "resolved $count target(s) into the release asset list"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Aegis ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body_path: release-notes.md
          generate_release_notes: false
          # Fail closed, like `if-no-files-found: error` on the upload steps: a
          # release missing a binary — or the MIT attribution for the statically
          # linked Tree-sitter components — must not publish with a warning.
          fail_on_unmatched_files: true
          files: ${{ steps.assets.outputs.files }}

  publish-npm:
    name: Publish npm package
    needs: [config, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      always() && needs.config.result == 'success' &&
      ((github.event_name == 'push' && needs.release.result == 'success' &&
        !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') &&
        !contains(github.ref_name, '-alpha')) || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate npm publish target
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "npm publish requires a stable vX.Y.Z tag" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "npm recovery must run from main" >&2
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)"
            case "$status" in
              identical | behind) ;;
              *) echo "release tag $TAG is not reachable from main" >&2; exit 1 ;;
            esac
          else
            SHA="$GITHUB_SHA"
            tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            if [ "$tag_sha" != "$SHA" ]; then
              echo "release tag $TAG moved after this workflow started" >&2
              exit 1
            fi
          fi
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$is_draft" != false ]; then
            echo "GitHub Release $TAG is not published" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.target.outputs.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use pinned npm CLI
        env:
          NPM_CLI_VERSION: ${{ needs.config.outputs.npm_cli_version }}
        run: |
          npm install --global npm@${NPM_CLI_VERSION}
          npm --version

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.config.outputs.rust_toolchain }}
          cache: "false"

      - uses: ./.github/actions/install-libcap

      - name: Generate npm checksums from release assets
        env:
          AEGIS_RELEASE_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: scripts/update-npm-package.sh "$TAG"

      - name: Verify npm package contract
        run: cargo test --test npm_package

      - name: Verify npm package contents
        working-directory: packaging/npm
        env:
          AEGIS_NPM_SKIP_DOWNLOAD: "1"
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee pack.log
          # `files` in package.json only lists candidates; assert the notice is
          # actually in the tarball, so the npm channel cannot ship the
          # statically linked Tree-sitter binary without its MIT attribution.
          grep -q 'THIRD_PARTY_NOTICES.md' pack.log
          rm -f pack.log

      - name: Publish npm package
        working-directory: packaging/npm
        env:
          # A recovery dispatch runs the workflow from main but checks out an
          # earlier tag. Do not claim main's commit as that package's source.
          NPM_CONFIG_PROVENANCE: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
        run: npm publish --access public
