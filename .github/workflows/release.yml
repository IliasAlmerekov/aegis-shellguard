name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: 1.94.0
  CROSS_VERSION: 0.2.5

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: aegis-linux-x86_64
            use_cross: true

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            asset_name: aegis-linux-aarch64
            use_cross: true

          # Pinned rather than macos-latest (which migrated to macOS 26 on
          # 2026-06-15, see actions/runner-images#14167) so a runner-image
          # bump never silently changes what a release is built on.
          - target: x86_64-apple-darwin
            os: macos-26-intel
            asset_name: aegis-macos-x86_64

          - target: aarch64-apple-darwin
            os: macos-26
            asset_name: aegis-macos-aarch64

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          cache-key-prefix: ${{ matrix.target }}-

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version ${{ env.CROSS_VERSION }} --locked

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        env:
          # The cross musl image installs a static musl libcap under
          # /usr/local (see docker/cross-musl/Dockerfile); pkg-config must be
          # told it is allowed to report a cross libcap.
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/aegis ${{ matrix.asset_name }}
          chmod 0755 ${{ matrix.asset_name }}

      - name: Verify static Linux binary
        if: contains(matrix.target, 'unknown-linux-musl')
        shell: bash
        run: |
          asset="${{ matrix.asset_name }}"
          file "$asset"
          # Inspect the ELF headers directly instead of running ldd. ldd executes
          # the binary's loader, which is unreliable for cross-compiled foreign
          # architectures and misreports static-pie binaries. A truly static
          # binary has no dynamic interpreter (PT_INTERP) and no shared library
          # dependencies (DT_NEEDED) — this holds for both classic "statically
          # linked" and musl "static-pie linked" outputs.
          if readelf -l "$asset" | grep -qw INTERP; then
            echo "expected static binary, but found a dynamic interpreter (PT_INTERP)" >&2
            readelf -l "$asset" >&2
            exit 1
          fi
          if readelf -d "$asset" 2>/dev/null | grep -qw NEEDED; then
            echo "expected static binary, but found shared library dependencies (DT_NEEDED)" >&2
            readelf -d "$asset" >&2
            exit 1
          fi
          echo "OK: $asset is statically linked (no PT_INTERP, no DT_NEEDED)"

      - name: Generate SHA256 checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          else
            shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # The Release body is the curated `CHANGELOG.md` section for this tag, not
      # an auto-generated commit/PR list: someone opening the Release must read
      # what was added, changed, fixed, and secured, in the project's own words.
      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # Capture every line after the `## [<version>]` heading up to the next
          # `## [` heading — i.e. exactly one release section, without its title.
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # Fail closed, like the asset globs below: a tag whose CHANGELOG
          # section is missing or blank must not publish a Release that silently
          # documents nothing.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no non-empty '## [$version]' section for tag $TAG" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: Aegis ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body_path: release-notes.md
          generate_release_notes: false
          # Fail closed, like `if-no-files-found: error` on the upload steps: a
          # release missing a binary — or the MIT attribution for the statically
          # linked Tree-sitter components — must not publish with a warning.
          fail_on_unmatched_files: true
          # `files` is a literal block scalar: every line below is a glob pattern
          # and `#` is content, not a comment — a commented line would be treated
          # as an unmatched pattern and, with the fail-closed flag above, abort
          # the release. Keep this block to bare paths only.
          #
          # `THIRD_PARTY_NOTICES.md` is repo-relative rather than `artifacts/`-
          # prefixed: it is checked in and comes from this job's own
          # `actions/checkout` above, not from the build matrix.
          files: |
            artifacts/aegis-linux-x86_64
            artifacts/aegis-linux-x86_64.sha256
            artifacts/aegis-linux-aarch64
            artifacts/aegis-linux-aarch64.sha256
            artifacts/aegis-macos-x86_64
            artifacts/aegis-macos-x86_64.sha256
            artifacts/aegis-macos-aarch64
            artifacts/aegis-macos-aarch64.sha256
            THIRD_PARTY_NOTICES.md

  publish-npm:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache: "false"

      - uses: ./.github/actions/install-libcap

      - name: Generate npm checksums from release assets
        env:
          AEGIS_RELEASE_REPO: ${{ github.repository }}
        run: scripts/update-npm-package.sh "${{ github.ref_name }}"

      - name: Verify npm package contract
        run: cargo test --test npm_package

      - name: Verify npm package contents
        working-directory: packaging/npm
        env:
          AEGIS_NPM_SKIP_DOWNLOAD: "1"
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run 2>&1 | tee pack.log
          # `files` in package.json only lists candidates; assert the notice is
          # actually in the tarball, so the npm channel cannot ship the
          # statically linked Tree-sitter binary without its MIT attribution.
          grep -q 'THIRD_PARTY_NOTICES.md' pack.log
          rm -f pack.log

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required to publish @iliasalmerekov/aegis" >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"

      - name: Publish npm package
        working-directory: packaging/npm
        run: npm publish --access public
