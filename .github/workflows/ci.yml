name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main must always finish a full run (audit, deny, fuzz) — cancelling it
  # would let a commit land without ever going green, and would let the
  # weekly schedule/workflow_dispatch races kill an in-flight main push (or
  # vice versa). Only cancel superseded runs on non-main refs (feature
  # branches, PRs).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every pinned version this workflow uses lives in `.github/versions.env`, and
# every runner label in `.github/build-targets.json`. The `gate` job below
# loads both and re-exports them as job outputs, because `runs-on:` cannot read
# a workflow `env:` value. Nothing else here may hard-code a version.
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental artifacts are per-machine scratch: no CI job ever rebuilds on
  # the same runner, so they only inflate the cached `target/`.
  CARGO_INCREMENTAL: 0

jobs:
  # Two jobs in one, so that every other job takes a single cheap dependency.
  #
  # 1. The pinned versions and runner labels, read from `.github/versions.env`
  #    and `.github/build-targets.json` and re-exported as job outputs.
  # 2. The "is this worth a slow/expensive job" gate, used by every heavy job
  #    below (macOS runners, fuzzing, live network/Docker/SQLite integration
  #    tests, benchmark baselines). A regression in any of them only needs to
  #    be caught before it lands on main (via a PR targeting main), on the
  #    weekly schedule, or on a manual run, not on every push to a feature
  #    branch.
  #
  # Keep this job's `name:` unchanged; it is reported as a check run.
  gate:
    name: Determine heavy-job gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.compute.outputs.heavy }}
      rust_toolchain: ${{ steps.versions.outputs.rust_toolchain }}
      fuzz_nightly_toolchain: ${{ steps.versions.outputs.fuzz_nightly_toolchain }}
      cargo_audit_version: ${{ steps.versions.outputs.cargo_audit_version }}
      cargo_deny_version: ${{ steps.versions.outputs.cargo_deny_version }}
      cargo_fuzz_version: ${{ steps.versions.outputs.cargo_fuzz_version }}
      cross_version: ${{ steps.versions.outputs.cross_version }}
      node_version: ${{ steps.versions.outputs.node_version }}
      fuzz_runs: ${{ steps.versions.outputs.fuzz_runs }}
      fuzz_max_len: ${{ steps.versions.outputs.fuzz_max_len }}
      build_targets: ${{ steps.versions.outputs.build_targets }}
      linux_runner: ${{ steps.versions.outputs.linux_runner }}
      macos_runner: ${{ steps.versions.outputs.macos_runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/load-versions
        id: versions

      - name: Compute heavy-job gate
        id: compute
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" || ( "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.base.ref }}" == "main" ) ]]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
          else
            echo "heavy=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # The steps live in a composite action so release.yml can run the
      # identical checks on a tagged commit. Keep this job's name unchanged:
      # it is a required status check on main.
      - uses: ./.github/actions/quality-gate
        with:
          toolchain: ${{ needs.gate.outputs.rust_toolchain }}

  # The landing page is a separate npm workspace with its own test suite and
  # its own build. It shipped for a while with neither running in CI, so a
  # broken static export or a failing scene test could only be caught by
  # someone building it by hand. Cheap enough (~1 min) to run unconditionally
  # rather than behind a path filter — a filter would also have to be kept in
  # step with which files the build actually reads.
  landing:
    name: Landing (test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.gate.outputs.node_version }}
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: npm test
        run: npm test

      # `output: 'export'` means the build is the deploy artifact: if this
      # fails, DigitalOcean has nothing to serve.
      - name: npm run build
        run: npm run build

  security:
    name: Security (audit, deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      # Shared with release.yml through a composite action, like the quality
      # job above. Keep this job's name unchanged: it is a required status
      # check on main.
      - uses: ./.github/actions/security-gate
        with:
          toolchain: ${{ needs.gate.outputs.rust_toolchain }}
          cargo-audit-version: ${{ needs.gate.outputs.cargo_audit_version }}
          cargo-deny-version: ${{ needs.gate.outputs.cargo_deny_version }}

  build:
    name: Release build (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.gate.outputs.rust_toolchain }}
          cache-key-prefix: release-

      - uses: ./.github/actions/install-libcap

      - name: cargo build --release
        run: cargo build --release

  # macOS is expensive (10x Linux minutes on GitHub-hosted runners) — only
  # worth running where a regression would otherwise ship: PRs targeting
  # main (last chance to catch it before it merges), the weekly schedule,
  # and manual runs. Deliberately NOT re-run on push to main — the PR that
  # merged it already ran this job, so re-running on the merge commit is
  # redundant. Feature-branch pushes/PRs stay Linux-only; release.yml still
  # builds real macOS binaries for every tagged release regardless of this
  # gate.
  build-macos:
    name: Release build (macos-26)
    runs-on: ${{ needs.gate.outputs.macos_runner }}
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.gate.outputs.rust_toolchain }}
          cache-key-prefix: release-

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test --workspace
        run: cargo test --workspace

  # ADR-022 §8 / Iteration 10: the qualified grammar set must be identical —
  # and present — in the shipping binary on every official release target.
  # Cross targets cannot execute tests, so this compiles the release binary
  # itself rather than aegis-language test artifacts. Host grammar smoke tests
  # in the quality job prove runtime parse presence. Same heavy-job gate as
  # build-macos: macOS runners and cross toolchains are expensive, so this only
  # runs on PRs targeting main, the weekly schedule, and manual runs.
  #
  # The matrix and the build steps are shared with release.yml: the matrix
  # through `build_targets` (from `.github/build-targets.json`), the steps
  # through the `build-target` composite action. CI therefore compiles what a
  # release ships, not a copy of it that can drift.
  cross-matrix:
    name: Cross build (${{ matrix.target }})
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.build_targets) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.gate.outputs.rust_toolchain }}
          targets: ${{ matrix.target }}
          cache-key-prefix: cross-${{ matrix.target }}-

      - name: Build release binary (qualified grammar presence)
        uses: ./.github/actions/build-target
        with:
          target: ${{ matrix.target }}
          use-cross: ${{ matrix.use_cross }}
          cross-version: ${{ needs.gate.outputs.cross_version }}

  # Heavy/slow job (bench + criterion). Full-fidelity run is only needed
  # before it lands on main or on the weekly schedule — same gate as
  # build-macos above.
  performance:
    name: Performance baseline (scanner bench)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.gate.outputs.rust_toolchain }}
          cache-key-prefix: perf-

      - uses: ./.github/actions/install-libcap

      # The `perf-` cache restores `target/` (including `target/criterion`) from
      # a previous run, so a bench that stops executing — a deleted `run:` line, a
      # renamed Criterion group — would leave last run's `new/estimates.json` in
      # place and `aegis_benchcheck` would gate against a stale measurement. Drop
      # the Criterion tree so a missing result fails the policy, as intended.
      - name: Discard cached Criterion results
        run: rm -rf target/criterion

      - name: cargo bench --bench scanner_bench
        run: cargo bench --bench scanner_bench

      # ADR-022 Iteration 0 RED #3: a no-source command must not start the
      # language worker or perform filesystem metadata calls. The bench asserts
      # Outcome::NotStarted inside its iteration body, so a regression that
      # makes a no-source command start the worker panics and fails this job.
      # The contract is also pinned by a fast `tests/no_source.rs` test in the
      # quality job; this harness keeps the no-source path on the perf wall.
      - name: cargo bench --bench no_source_bench -p aegis-language
        run: cargo bench --bench no_source_bench -p aegis-language

      # ADR-022 Iteration 0 GREEN measurement: parse latency per foundation
      # grammar. Parses one representative inline-source snippet per grammar so
      # the recorded latency reflects the slow-path cost an inline interpreter
      # target would pay. Since Iteration 10 each recorded mean is also gated by
      # a row in perf/scanner_bench_baseline.toml, so editing a snippet requires
      # rebaselining that row (see docs/performance-baseline.md).
      - name: cargo bench --bench parse_latency_bench -p aegis-language
        run: cargo bench --bench parse_latency_bench -p aegis-language

      # ADR-034: the Startup cost budget covers one process invocation from
      # process start to decision, the part scanner_bench's warm-loop shape
      # cannot see (it builds the Scanner outside the measured loop). This
      # belongs on the perf wall because construction, not classification, is
      # what actually dominates an agent's per-command latency.
      - name: cargo bench --bench startup_bench
        run: cargo bench --bench startup_bench

      - name: Evaluate benchmark policy
        # `shell: bash` is load-bearing: Actions' implicit Linux shell is
        # `bash -e {0}` *without* `pipefail`, so the pipe into `tee` would report
        # `tee`'s exit code and a failing benchmark policy would go green.
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --bin aegis_benchcheck -- \
            --baseline perf/scanner_bench_baseline.toml \
            --criterion-root target/criterion | tee benchmark-report.txt

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scanner-bench-artifacts
          path: |
            benchmark-report.txt
            target/criterion

  # Hits the real GitHub Releases API — only worth the network flakiness
  # risk and runtime before it lands on main or on the weekly schedule.
  # One job per platform, because the installer resolves a different release
  # asset on each; the steps are identical apart from the libcap headers,
  # which only a Linux compile needs.
  live-installer:
    name: Live installer validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ needs.gate.outputs.linux_runner }}
            needs_libcap: true
          - os: ${{ needs.gate.outputs.macos_runner }}
            needs_libcap: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.gate.outputs.rust_toolchain }}
          cache-key-prefix: live-installer-

      - uses: ./.github/actions/install-libcap
        if: matrix.needs_libcap

      - name: Run live installer test
        run: AEGIS_TEST_LIVE_INSTALL=1 cargo test --test installer_live_release test_installer_live_github_release_download

  # Spins up real Docker + SQLite fixtures — same cost/coverage tradeoff as
  # build-macos above.
  snapshot-rollback-live:
    name: Live snapshot/rollback (Docker + SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.gate.outputs.rust_toolchain }}
          cache-key-prefix: snapshot-rollback-

      - uses: ./.github/actions/install-libcap

      - name: Install SQLite CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Pull Docker fixture image
        run: docker pull alpine

      - name: Run live Docker snapshot rollback test
        env:
          AEGIS_DOCKER_TESTS: "1"
        run: cargo test --test docker_integration snapshot_rollback_reverts_filesystem_change -- --exact --nocapture

      - name: Run live SQLite snapshot rollback test
        env:
          AEGIS_SQLITE_SNAPSHOT_TESTS: "1"
        run: cargo test --test snapshot_rollback_live sqlite_snapshot_rollback_restores_database_file_through_aegis_cli -- --exact --nocapture

  # 900k total fuzz iterations across the parser/scanner/router/protocol/heredoc and
  # four production-qualified language adapters. This is the most expensive
  # Linux job in this workflow. Same cost/coverage tradeoff as build-macos
  # above: a regression here only needs to be caught before main or weekly.
  fuzz:
    name: Fuzzing (parser, scanner, routing, protocol, adapters)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: gate
    if: needs.gate.outputs.heavy == 'true'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ needs.gate.outputs.fuzz_nightly_toolchain }}
          cache-key-prefix: fuzz-

      - uses: ./.github/actions/install-libcap

      - uses: ./.github/actions/install-cargo-tool
        with:
          tool: cargo-fuzz
          version: ${{ needs.gate.outputs.cargo_fuzz_version }}
          # cargo-fuzz's published Cargo.lock pins rustix 0.36.5, which fails to
          # build on current nightly (rustc_attrs got stricter). Letting cargo
          # re-resolve deps picks up a compatible rustix instead.
          locked: "false"

      # One step per target would be nine near-identical copies of the same
      # command line. The loop keeps the target list readable and makes adding
      # a target a one-line change; `::group::` keeps each target's output
      # foldable in the log, and the failing target name is echoed before the
      # run, so a crash is still attributable from the log alone.
      - name: Run fuzz targets
        shell: bash
        env:
          # libFuzzer's leak detector reports leaks in the grammar allocations
          # the adapters keep alive for the process lifetime.
          LSAN_OPTIONS: detect_leaks=0
          TOOLCHAIN: ${{ needs.gate.outputs.fuzz_nightly_toolchain }}
          RUNS: ${{ needs.gate.outputs.fuzz_runs }}
          MAX_LEN: ${{ needs.gate.outputs.fuzz_max_len }}
        run: |
          set -euo pipefail
          for target in parser scanner heredoc language_protocol router \
                        language_python language_javascript language_typescript \
                        language_bash; do
            echo "::group::cargo fuzz run $target"
            cargo "+$TOOLCHAIN" fuzz run "$target" "fuzz/corpus/$target" \
              -- "-runs=$RUNS" "-max_len=$MAX_LEN"
            echo "::endgroup::"
          done

      # A crash leaves its reproducer in fuzz/artifacts/<target>/. Without this
      # the input that broke the parser only exists on a runner that is about
      # to be destroyed, and the failure is not reproducible off the log.
      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
