name: Security gate
description: >-
  Run the supply-chain gate: cargo-audit for known CVEs and cargo-deny for the
  license, duplicate, and ban policy. The caller must run actions/checkout
  first.

# Why a composite action rather than a reusable `on: workflow_call` workflow:
# a called workflow's jobs report as "<caller job> / <called job>", so
# extracting the CI `security` job that way would rename its check run. The
# `main` branch protection requires the bare context "Security (audit, deny)",
# and a renamed check never reports it — every pull request would wait forever
# on a context that no longer exists. A composite action shares the steps
# without touching any job name.

inputs:
  toolchain:
    description: "Rust toolchain version to install. Comes from .github/versions.env."
    required: true
  cargo-audit-version:
    description: "Pinned cargo-audit version. Comes from .github/versions.env."
    required: true
  cargo-deny-version:
    description: "Pinned cargo-deny version. Comes from .github/versions.env."
    required: true
  cache-key-prefix:
    description: >-
      Prefix passed through to the setup-rust cargo cache key. The default
      keeps every security-gate caller on one shared cache.
    required: false
    default: "security-"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust
      with:
        toolchain: ${{ inputs.toolchain }}
        cache-key-prefix: ${{ inputs.cache-key-prefix }}

    - uses: ./.github/actions/install-cargo-tool
      with:
        tool: cargo-audit
        version: ${{ inputs.cargo-audit-version }}

    - name: cargo audit
      shell: bash
      run: cargo audit

    - uses: ./.github/actions/install-cargo-tool
      with:
        tool: cargo-deny
        version: ${{ inputs.cargo-deny-version }}

    - name: cargo deny check
      shell: bash
      run: cargo deny check
