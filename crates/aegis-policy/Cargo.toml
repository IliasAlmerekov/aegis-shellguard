[package]
name = "aegis-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-policy"
description = "Pure policy evaluation for Aegis: maps a scanner Assessment plus mode/CI/allowlist context to a decision. Depends on aegis-types and aegis-scanner."

[dependencies]
aegis-types.workspace = true
aegis-scanner.workspace = true
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
aegis-parser.workspace = true
