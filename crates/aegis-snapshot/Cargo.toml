[package]
name = "aegis-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-snapshot"
description = "Snapshot and rollback plugins for Aegis."

[dependencies]
aegis-types.workspace = true
aegis-config.workspace = true
async-trait = "0.1"
thiserror = "1"
tokio = { version = "1", features = ["process", "fs", "rt", "rt-multi-thread", "io-util", "sync", "time"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
# `std` exposes stored uid metadata but no effective-uid query; libc provides
# `geteuid` without adding a native build dependency.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
