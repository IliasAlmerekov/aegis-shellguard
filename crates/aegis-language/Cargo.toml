[package]
name = "aegis-language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-language"
description = "Language-aware analysis foundation for Aegis — isolated Tree-sitter worker boundary, grammar manifest, and detected-operation adapters (ADR-022)."

[dependencies]
thiserror = "2"
tree-sitter = { version = "=0.26.13", optional = true }
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-javascript = { version = "=0.25.0", optional = true }
tree-sitter-python = { version = "=0.25.0", optional = true }
tree-sitter-typescript = { version = "=0.23.2", optional = true }

[features]
# Enables the Tree-sitter runtime, pinned grammars, adapters, and worker (ADR-054).
grammars = [
    "dep:tree-sitter",
    "dep:tree-sitter-bash",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-typescript",
]
# Exposes language lookup helpers to integration tests. Never enable it in a
# release build.
testing = []

[dev-dependencies]
aegis-language = { workspace = true, features = ["testing"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Fails if a no-source command starts the language worker (ADR-022 §1).
[[bench]]
name = "no_source_bench"
harness = false
required-features = ["grammars"]

# Per-grammar parse latency benchmark (ADR-022 §8).
[[bench]]
name = "parse_latency_bench"
harness = false
required-features = ["grammars"]

[lints]
workspace = true
