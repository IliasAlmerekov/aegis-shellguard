[package]
name = "aegis-language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-language"
description = "Language-aware analysis foundation for Aegis — isolated Tree-sitter worker boundary, grammar manifest, and detected-operation adapters (ADR-022)."

[dependencies]
thiserror = "2"
tree-sitter = "=0.26.13"
tree-sitter-bash = "=0.25.1"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-typescript = "=0.23.2"

[features]
# Exposes language lookup helpers to integration tests. Never enable it in a
# release build.
testing = []

[dev-dependencies]
aegis-language = { workspace = true, features = ["testing"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Fails if a no-source command starts the language worker (ADR-022 §1).
[[bench]]
name = "no_source_bench"
harness = false

# Per-grammar parse latency benchmark (ADR-022 §8).
[[bench]]
name = "parse_latency_bench"
harness = false

[lints]
workspace = true
