[package]
name = "aegis-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-audit"
description = "Append-only JSONL audit log with optional hash-chain integrity for Aegis."

[dependencies]
aegis-types.workspace = true
aegis-scanner.workspace = true
aegis-config.workspace = true
aegis-explanation.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
sha2 = "0.10"
flate2 = "1"
thiserror = "1"
# `std` exposes stored uid metadata but no effective-uid query; libc provides
# `geteuid` and Unix no-follow flags without adding a native build dependency.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
aegis-policy.workspace = true
aegis-scanner.workspace = true
