[package]
name = "aegis-scanner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-scanner"
description = "Command risk scanner for Aegis: PatternSet loading, Aho-Corasick quick scan, regex full scan, and prefix-rule matching. Depends on aegis-types and aegis-parser."

[dependencies]
aegis-types.workspace = true
aegis-parser.workspace = true
regex = "1.11"
aho-corasick = "1.1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
