[package]
name = "aegis-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-config"
description = "Configuration model, layered loader, validation, JSON schema, and decision-persistence (amend) for Aegis. Depends on aegis-types and aegis-scanner."

[dependencies]
aegis-types.workspace = true
aegis-scanner.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.8"
schemars = "1"
thiserror = "1"
tracing = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
regex = "1.11"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
