[package]
name = "aegis-types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aegis-types"
description = "Core data types for Aegis: RiskLevel, Decision, Pattern, and the shared pattern vocabulary. Zero dependencies beyond serde/schemars."

[dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "1"

[dev-dependencies]
serde_json = "1"
