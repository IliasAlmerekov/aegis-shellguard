<!doctype html>
<html lang="en" style="background-color: #000000; color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aegis is a Rust shell guardrail for AI agents. It asks before risky commands run and blocks catastrophic commands."
    />
    <title>Aegis — AI shell command guardrail</title>
    <!-- Geist is self-hosted: no third party on the critical render path.
         Both faces sit above the fold (headline, nav wordmark, install
         snippet), so both are preloaded — the swap lands before first paint
         instead of reflowing the hero. -->
    <link
      rel="preload"
      href="/fonts/geist-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/geist-mono-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html,
      body,
      #root {
        background-color: #000 !important;
      }
    </style>
  </head>
  <body style="background-color: #000000; margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
