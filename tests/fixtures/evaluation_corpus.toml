# Inputs for tests/evaluation_golden.rs that no other fixture holds.
# The test also reads every `[[cases]]` entry of security_bypass_corpus.toml.
# Exact duplicates of a command in an earlier source are left out.

# Git-tracked shell fuzz seeds, listed one by one: fuzz/corpus/router holds many
# untracked generated files that a directory scan would pick up.
seed_files = [
    "fuzz/corpus/heredoc/basic.txt",
    "fuzz/corpus/heredoc/quoted-delimiter.txt",
    "fuzz/corpus/heredoc/strip-tabs.txt",
    "fuzz/corpus/heredoc/unterminated.txt",
    "fuzz/corpus/parser/empty.txt",
    "fuzz/corpus/parser/heredoc.txt",
    "fuzz/corpus/parser/inline-python.txt",
    "fuzz/corpus/parser/nested-shell.txt",
    "fuzz/corpus/parser/quotes.txt",
    "fuzz/corpus/parser/unterminated-heredoc.txt",
    "fuzz/corpus/parser/unterminated-quote.txt",
    "fuzz/corpus/parser/whitespace.txt",
    "fuzz/corpus/router/cd-prefix-and-pipeline.txt",
    "fuzz/corpus/router/direct-exec.txt",
    "fuzz/corpus/router/explicit-interpreter.txt",
    "fuzz/corpus/router/heredoc-marker-glued-to-chain.txt",
    "fuzz/corpus/router/heredoc-tee-then-exec.txt",
    "fuzz/corpus/router/heredoc-write-then-exec.txt",
    "fuzz/corpus/router/script-file-argument.txt",
    "fuzz/corpus/router/unicode-next-line.txt",
    "fuzz/corpus/scanner/heredoc-danger.txt",
    "fuzz/corpus/scanner/inline-encoding.txt",
    "fuzz/corpus/scanner/nested-shell.txt",
    "fuzz/corpus/scanner/quoted-escape.txt",
    "fuzz/corpus/scanner/subshell-grouping.txt",
]

[[commands]]
name = "scanner_safe_command"
command = "ls -la /home/user"

[[commands]]
name = "scanner_git_global_option"
command = "git -C . --no-pager reset --hard"

[[commands]]
name = "scanner_dangerous_01"
command = "rm -rf /home/user/old-project"

[[commands]]
name = "scanner_dangerous_02"
command = "find /var/log -name '*.log' -delete"

[[commands]]
name = "scanner_dangerous_03"
command = "dd if=/dev/zero of=/dev/sda bs=1M"

[[commands]]
name = "scanner_dangerous_04"
command = "shred -uzn 3 secrets.key"

[[commands]]
name = "scanner_dangerous_05"
command = "mkfs.ext4 /dev/sdb1"

[[commands]]
name = "scanner_dangerous_06"
command = "echo data > /dev/sda"

[[commands]]
name = "scanner_dangerous_07"
command = "mv /etc/hosts /tmp/hosts.bak"

[[commands]]
name = "scanner_dangerous_08"
command = "truncate -s 0 data.log"

[[commands]]
name = "scanner_dangerous_09"
command = "chmod 777 /var/www/html"

[[commands]]
name = "scanner_dangerous_10"
command = "chown -R www-data /var/www"

[[commands]]
name = "scanner_dangerous_11"
command = "git reset --hard HEAD~1"

[[commands]]
name = "scanner_dangerous_12"
command = "git clean -fd src/"

[[commands]]
name = "scanner_dangerous_13"
command = "git push origin main --force"

[[commands]]
name = "scanner_dangerous_14"
command = "git filter-branch --tree-filter 'rm -f secret.txt' HEAD"

[[commands]]
name = "scanner_dangerous_15"
command = "git stash drop stash@{0}"

[[commands]]
name = "scanner_dangerous_17"
command = "DROP TABLE users;"

[[commands]]
name = "scanner_dangerous_18"
command = "DROP DATABASE myapp_production;"

[[commands]]
name = "scanner_dangerous_19"
command = "DELETE FROM accounts;"

[[commands]]
name = "scanner_dangerous_20"
