rm -rf /
EOF
)
eval \"$x\""""
expected_risk = "block"
expected_decision = "block"
expected_exit_code = 3
expected_block_reason = "intrinsic_risk_block"

[[cases]]
# Commit c696273 trusts a captured heredoc only when every later use
# forwards it. Running the variable inside a subshell group is neither
# forwarding nor one of the indirection words the parser scans for by
# name, so this guards that the body still fires.
name = "heredoc_capture_then_subshell_group_block"
command = """x=$(cat <<'EOF'
rm -rf /
EOF
)
($x)"""
expected_risk = "block"
expected_decision = "block"
expected_exit_code = 3
expected_block_reason = "intrinsic_risk_block"

[[cases]]
# Same allowlist, a wrapper program this time: `sudo` is not on the
# trusted-forwarding list, so handing it the captured variable still
# runs the body as root.
name = "heredoc_capture_then_sudo_block"
command = """x=$(cat <<'EOF'
rm -rf /
EOF
)
sudo $x"""
expected_risk = "block"
expected_decision = "block"
expected_exit_code = 3
expected_block_reason = "intrinsic_risk_block"

[[cases]]
# Issue #396 review (BLOCKER on PR #463): printf -v launders a captured
# heredoc variable into a second variable, so the forwarding allowlist
# must not clear the printf call itself. The second variable's later run
# still fires FS-001.
name = "heredoc_capture_then_printf_v_launder_block"
command = """x=$(cat <<'EOF'
rm -rf /
EOF
)
printf -v y '%s' \"$x\"
bash -c \"$y\""""
expected_risk = "block"
expected_decision = "block"
expected_exit_code = 3
expected_block_reason = "intrinsic_risk_block"

[[cases]]
# PR #463 review (BLOCKER): a leading assignment can change which program
# runs. `PATH=/tmp/p cat` finds a planted `/tmp/p/cat` that is really a
# shell, so any assignment ahead of the consumer drops the data trust.
name = "heredoc_data_consumer_path_prefix_assignment_block"
command = """PATH=/tmp/p cat <<'EOF'
rm -rf /
EOF"""
expected_risk = "block"
expected_decision = "block"
expected_exit_code = 3
expected_block_reason = "intrinsic_risk_block"

[[cases]]
# PR #463 review: a consumer named by path (`./cat`, `/tmp/p/cat`) can be
