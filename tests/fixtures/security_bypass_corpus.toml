name = "heredoc_data_consumer_relative_path_block"
command = """./cat <<'EOF'
rm -rf /
EOF"""
expected_risk = "block"
expected_decision = "block"
expected_exit_code = 3
expected_block_reason = "intrinsic_risk_block"

# A Danger-tier body under `./cat` keeps its ordinary risk: the untrusted
