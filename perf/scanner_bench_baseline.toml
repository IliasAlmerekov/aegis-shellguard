default_regression_pct = 25.0

# Per-command Assessment budget (ADR-034). Replaces the retired batch row that
# timed 1,000 commands per iteration: a batch mean cannot be compared against
# a per-command budget, and it had been compared that way in project documents.
#
# Rebaselined 2026-09-16 from 700: the original value was within 5% of a
# single capture, and three repeated local runs spread 568.7-725 ns, a 27.5%
# swing against the 25% threshold. See "safe_command_assess and
# scanner_construction rebaseline" in docs/performance-baseline.md.
[[benchmarks]]
name = "safe_command_assess"
baseline_ns = 1_500
regression_pct = 25.0
budget_ns = 2_000_000
description = "One assess() call on a typical safe command, against the 2 ms Assessment budget."

[[benchmarks]]
name = "100_dangerous_commands"
baseline_ns = 1_000_000
regression_pct = 25.0
description = "100 dangerous commands exercise the full regex verification path across categories."

# Rebaselined 2026-08-04 from 300_000: the 2026-04-11 value was captured before
# launcher-prefix normalization (bdfbaf9) made the inline body a second regex
# scan target, and the gate was inert until 6f886b3 so the drift was never
# reported. See "heredoc_worst_case rebaseline (2026-08-04)" in
# docs/performance-baseline.md for the bisect evidence and the open follow-up.
[[benchmarks]]
name = "heredoc_worst_case"
baseline_ns = 1_000_000
regression_pct = 30.0
budget_ns = 2_000_000
description = "Worst-case inline-script/heredoc scanning should stay bounded on shared CI hardware."

