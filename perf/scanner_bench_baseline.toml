# Startup cost rows (ADR-034), benches/startup_bench.rs. scanner_construction
# and runtime_context_construction measure disjoint work: a default config has
# no custom_patterns, so runtime context construction reuses the already-warm
# BUILTIN_SCANNER static instead of building a scanner of its own.
#
# Rebaselined 2026-09-16 (issue #319 — see "Discarded scanner builds removed;
# lazy built-in compile tried and reverted" in docs/performance-baseline.md).
# Only runtime_context_construction moved: `validate_custom_patterns` no
# longer builds a scanner it discards for an empty custom-pattern slice, which
# is what this row mostly paid for beyond its `id -un` spawn. Lazy built-in
# regex compilation (which would have also lowered scanner_construction) was
# implemented and then reverted — it pushed ordinary cold `assess()` calls
# past the 2 ms Assessment budget — so scanner_construction is unchanged: it
# is still dominated by eager regex compilation, same as before this issue.

[[benchmarks]]
name = "scanner_construction"
baseline_ns = 16_500_000
regression_pct = 25.0
description = "PatternSet::load() plus Scanner::try_new(), the one-per-process scanner build."

[[benchmarks]]
name = "runtime_context_construction"
baseline_ns = 2_200_000
regression_pct = 25.0
description = "RuntimeContext::new() from a default config, reusing the warm BUILTIN_SCANNER static; includes one id -un process spawn. No longer pays a discarded custom-pattern scanner build (issue #319)."

# Set 2026-09-17 from the CI runner (PR #327 `performance` job, observed
# 14.5 ms). With the 50% threshold the regression gate sits at 30 ms, the same
# value as budget_ns. A higher baseline would put the gate above the budget,
# where it could never fire first.
[[benchmarks]]
name = "startup_safe_command"
baseline_ns = 20_000_000
regression_pct = 50.0
budget_ns = 30_000_000
description = "One full aegis process invocation, from process start to decision, on an evaluated safe command."
