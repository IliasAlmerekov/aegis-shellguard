[package]
name = "aegis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terminal proxy that intercepts AI agent shell commands and requires human confirmation before destructive operations"
repository.workspace = true
homepage.workspace = true
keywords = ["security", "ai", "shell", "cli", "safety"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = [
    ".claude/**",
    ".codex/**",
    ".planning/**",
    "*.txt",
]

[workspace]
members = [
    "crates/aegis-types",
    "crates/aegis-parser",
    "crates/aegis-scanner",
    "crates/aegis-policy",
    "crates/aegis-config",
    "crates/aegis-explanation",
    "crates/aegis-tui",
    "crates/aegis-audit",
    "crates/aegis-snapshot",
    "crates/aegis-starlark",
    "crates/aegis-sandbox",
    "crates/aegis-language",
]
# The cargo-fuzz crate is built standalone by `cargo fuzz` with its own
# sanitizer flags; it must not be pulled into the main workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.6.11"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/IliasAlmerekov/aegis-shellguard"
homepage = "https://github.com/IliasAlmerekov/aegis-shellguard"

# Single source of truth for every internal crate's version + path, so a
# release bump is one edit instead of one per crate per dependent.
[workspace.dependencies]
aegis-types = { version = "0.6.11", path = "crates/aegis-types" }
aegis-parser = { version = "0.6.11", path = "crates/aegis-parser" }
aegis-scanner = { version = "0.6.11", path = "crates/aegis-scanner" }
aegis-policy = { version = "0.6.11", path = "crates/aegis-policy" }
aegis-config = { version = "0.6.11", path = "crates/aegis-config" }
aegis-explanation = { version = "0.6.11", path = "crates/aegis-explanation" }
aegis-tui = { version = "0.6.11", path = "crates/aegis-tui" }
aegis-audit = { version = "0.6.11", path = "crates/aegis-audit" }
aegis-snapshot = { version = "0.6.11", path = "crates/aegis-snapshot" }
aegis-starlark = { version = "0.6.11", path = "crates/aegis-starlark" }
aegis-sandbox = { version = "0.6.11", path = "crates/aegis-sandbox" }
aegis-language = { version = "0.6.11", path = "crates/aegis-language" }

[features]
default = []
starlark-policy = ["dep:aegis-starlark"]

[dependencies]
aegis-types.workspace = true
aegis-parser.workspace = true
aegis-scanner.workspace = true
aegis-policy.workspace = true
aegis-config.workspace = true
aegis-explanation.workspace = true
aegis-tui.workspace = true
aegis-audit.workspace = true
aegis-snapshot.workspace = true
aegis-starlark = { workspace = true, optional = true }
aegis-sandbox.workspace = true
aegis-language.workspace = true
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
async-trait = "0.1"
tokio = { version = "1", features = ["process", "fs", "rt", "rt-multi-thread", "io-util", "io-std", "sync", "time"] }
regex = "1.11"
aho-corasick = "1.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
flate2 = "1"
sha2 = "0.10"
schemars = "1"
semver = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "scanner_bench"
harness = false

[[bench]]
name = "startup_bench"
harness = false

[[bench]]
name = "router_bench"
harness = false
